name: "Proponer un proyecto"
description: "Propón un proyecto inspirado en My Little Pony para el archivo."
body:
  - type: markdown
    attributes:
      value: "Se admiten proyectos históricos, abandonados, incompletos y experimentales. Usa el idioma original y deja en blanco los campos opcionales si hay dudas. Las propuestas son públicas. Comparte solo enlaces y materiales aptos para su difusión pública. Para corregir una ficha o aportar documentación histórica, indica el nombre del proyecto existente y explica en la descripción qué debe actualizarse."
  - type: markdown
    attributes:
      value: "Política completa: https://github.com/Evan-Windproof/MLP-OS-Archive/blob/main/docs/INCLUSION_POLICY.md\n\nRequisitos: la experiencia real del sistema o escritorio debe incluir elementos sustanciales de MLP. No basta con cambiar el fondo de una distribución Linux ni con usar un nombre relacionado con MLP. Los proyectos históricos de terceros pueden estar inacabados o abandonados; los sistemas propios deben mostrar desarrollo real. También pueden admitirse colecciones independientes de temas de escritorio.\n\nPruebas: aporta fuentes públicas y rastreables. Deja en blanco los datos desconocidos; no los inventes. Comprueba si ya existe el proyecto o uno con el mismo nombre.\n\nDerechos: este archivo es un proyecto de fans no oficial y sin fines comerciales. Acredita a los creadores. No subas ni redistribuyas archivos, capturas, ilustraciones, ISO o temas de terceros sin licencia o permiso explícito."
  - type: input
    id: name
    attributes:
      label: "Nombre del proyecto"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "Categoría del proyecto"
      options:
        - "Sistemas operativos independientes"
        - "Distribuciones Linux"
        - "Temas y personalizaciones del sistema"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Descripción breve del proyecto"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: "URL de las fuentes o referencias"
      description: "Incluye al menos una URL pública HTTP o HTTPS. Se aceptan páginas archivadas, publicaciones de versiones y documentos de la época."
    validations:
      required: true
  - type: input
    id: aliases
    attributes:
      label: "Nombres alternativos"
  - type: input
    id: developer
    attributes:
      label: "Desarrollador o equipo"
  - type: input
    id: developmentYear
    attributes:
      label: "Año de inicio del desarrollo"
  - type: input
    id: lastUpdated
    attributes:
      label: "Última actualización conocida"
  - type: input
    id: baseSystem
    attributes:
      label: "Sistema operativo base"
  - type: input
    id: kernel
    attributes:
      label: "Información sobre el núcleo"
  - type: input
    id: sourceCodeUrl
    attributes:
      label: "Repositorio de GitHub o GitLab"
  - type: input
    id: officialWebsite
    attributes:
      label: "Sitio oficial"
  - type: textarea
    id: downloadUrl
    attributes:
      label: "Enlaces de descarga"
  - type: textarea
    id: screenshots
    attributes:
      label: "Capturas de pantalla históricas"
      description: "Incluye las URL, los créditos de autoría o procedencia y las condiciones de uso conocidas."
  - type: textarea
    id: documentation
    attributes:
      label: "Documentación"
  - type: input
    id: license
    attributes:
      label: "Licencia"
  - type: dropdown
    id: developmentStatus
    attributes:
      label: "Estado de desarrollo"
      options:
        - "Activo"
        - "En mantenimiento"
        - "Abandonado"
        - "Archivado"
        - "Experimental"
        - "Desconocido"
  - type: textarea
    id: historicalNotes
    attributes:
      label: "Información histórica adicional"
