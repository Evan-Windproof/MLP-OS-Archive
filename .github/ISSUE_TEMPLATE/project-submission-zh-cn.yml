name: "提交项目"
description: "推荐一个《小马宝莉》主题项目供档案收录。"
body:
  - type: markdown
    attributes:
      value: "欢迎历史、已停更、未完成和实验项目。请使用原始语言，无法确定的选填信息可留空。议题是公开的，请只分享可以公开的链接和资料。 如果要更正资料或补充历史证据，请填写现有项目名称，并在说明中指出需要更新的内容。"
  - type: markdown
    attributes:
      value: "完整规则：https://github.com/Evan-Windproof/MLP-OS-Archive/blob/main/docs/INCLUSION_POLICY.md\n\n收录要求：项目的实际操作系统或桌面体验必须包含实质性的 MLP 元素。仅更换壁纸的 Linux 发行版或只有 MLP 名称的项目不符合要求。第三方历史项目可以未完成或已停更；自行提交的操作系统必须有实际开发成果。独立桌面主题包也可以收录。\n\n证据：请提供可追溯的公开来源。未知信息可以留空，不要猜测。提交前请检查重复项目和同名项目。\n\n版权：本档案为非官方、非商业粉丝项目。请注明创作者。除非许可证或明确授权允许，否则不要上传或重新分发第三方文件、截图、插画、ISO 或主题包。"
  - type: input
    id: name
    attributes:
      label: "项目名称"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "项目类别"
      options:
        - "独立操作系统"
        - "Linux 发行版"
        - "操作系统主题与定制"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "项目简介"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: "来源或参考资料链接"
      description: "请至少提供一个公开的 HTTP 或 HTTPS 链接。网页存档、发布记录和当时的文档均可。"
    validations:
      required: true
  - type: input
    id: aliases
    attributes:
      label: "其他名称"
  - type: input
    id: developer
    attributes:
      label: "开发者或团队"
  - type: input
    id: developmentYear
    attributes:
      label: "开始开发的年份"
  - type: input
    id: lastUpdated
    attributes:
      label: "最后一次已知更新"
  - type: input
    id: baseSystem
    attributes:
      label: "基础操作系统"
  - type: input
    id: kernel
    attributes:
      label: "内核信息"
  - type: input
    id: sourceCodeUrl
    attributes:
      label: "GitHub 或 GitLab 仓库"
  - type: input
    id: officialWebsite
    attributes:
      label: "官方网站"
  - type: textarea
    id: downloadUrl
    attributes:
      label: "下载链接"
  - type: textarea
    id: screenshots
    attributes:
      label: "历史截图"
      description: "请提供链接、创作者或来源的署名，以及已知的使用条款。"
  - type: textarea
    id: documentation
    attributes:
      label: "文档"
  - type: input
    id: license
    attributes:
      label: "许可证"
  - type: dropdown
    id: developmentStatus
    attributes:
      label: "开发状态"
      options:
        - "活跃"
        - "维护中"
        - "已停更"
        - "已归档"
        - "实验性"
        - "未知"
  - type: textarea
    id: historicalNotes
    attributes:
      label: "其他历史资料"
