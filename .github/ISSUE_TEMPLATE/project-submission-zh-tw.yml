name: "提交專案"
description: "推薦一個《彩虹小馬》主題專案供檔案庫收錄。"
body:
  - type: markdown
    attributes:
      value: "歡迎歷史、已停止維護、未完成及實驗性專案。請使用原始語言，無法確認的選填資訊可留空。議題是公開的，請只分享可以公開的連結與資料。 如果要更正資料或補充歷史證據，請填寫現有專案名稱，並在說明中指出需要更新的內容。"
  - type: markdown
    attributes:
      value: "完整規則：https://github.com/Evan-Windproof/MLP-OS-Archive/blob/main/docs/INCLUSION_POLICY.md\n\n收錄要求：專案的實際作業系統或桌面體驗必須包含實質的 MLP 元素。僅更換桌布的 Linux 發行版或只有 MLP 名稱的專案不符合要求。第三方歷史專案可以未完成或已停止維護；自行提交的作業系統必須已有實際開發成果。獨立桌面主題套件也可以收錄。\n\n證據：請提供可追溯的公開來源。未知資訊可以留空，不要猜測。提交前請檢查重複專案與同名專案。\n\n版權：本檔案庫是非官方、非商業粉絲專案。請標註創作者。除非授權條款或明確許可允許，否則請勿上傳或重新散布第三方檔案、截圖、插畫、ISO 或主題套件。"
  - type: input
    id: name
    attributes:
      label: "專案名稱"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "專案類別"
      options:
        - "獨立作業系統"
        - "Linux 發行版"
        - "作業系統主題與自訂"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "專案簡介"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: "來源或參考資料連結"
      description: "請至少提供一個公開的 HTTP 或 HTTPS 連結。網頁快照、版本發布紀錄與當時的文件均可。"
    validations:
      required: true
  - type: input
    id: aliases
    attributes:
      label: "其他名稱"
  - type: input
    id: developer
    attributes:
      label: "開發者或團隊"
  - type: input
    id: developmentYear
    attributes:
      label: "開始開發的年份"
  - type: input
    id: lastUpdated
    attributes:
      label: "最後一次已知更新"
  - type: input
    id: baseSystem
    attributes:
      label: "基礎作業系統"
  - type: input
    id: kernel
    attributes:
      label: "核心資訊"
  - type: input
    id: sourceCodeUrl
    attributes:
      label: "GitHub 或 GitLab 存放庫"
  - type: input
    id: officialWebsite
    attributes:
      label: "官方網站"
  - type: textarea
    id: downloadUrl
    attributes:
      label: "下載連結"
  - type: textarea
    id: screenshots
    attributes:
      label: "歷史螢幕擷取畫面"
      description: "請提供連結、創作者或來源的標註，以及已知的使用條款。"
  - type: textarea
    id: documentation
    attributes:
      label: "文件"
  - type: input
    id: license
    attributes:
      label: "授權條款"
  - type: dropdown
    id: developmentStatus
    attributes:
      label: "開發狀態"
      options:
        - "活躍"
        - "維護中"
        - "已停止維護"
        - "已封存"
        - "實驗性"
        - "未知"
  - type: textarea
    id: historicalNotes
    attributes:
      label: "其他歷史資料"
