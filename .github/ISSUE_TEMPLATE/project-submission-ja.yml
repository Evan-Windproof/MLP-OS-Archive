name: "プロジェクトを投稿する"
description: "『マイリトルポニー』をテーマにしたプロジェクトをアーカイブに推薦します。"
body:
  - type: markdown
    attributes:
      value: "過去の作品や開発が終了したもの、未完成・実験的なものも歓迎します。元の言語で記入し、不明な任意項目は空欄にしてください。Issueは公開されます。公開できるリンクと資料だけを共有してください。 既存の記録を訂正したり、歴史資料を追加したりする場合は、既存のプロジェクト名を入力し、更新してほしい内容を説明欄に記入してください。"
  - type: markdown
    attributes:
      value: "収録方針全文：https://github.com/Evan-Windproof/MLP-OS-Archive/blob/main/docs/INCLUSION_POLICY.md\n\n対象条件：実際のOSまたはデスクトップ体験に実質的なMLP要素が必要です。壁紙だけを変更したLinuxや、名称だけがMLPに関連するプロジェクトは対象外です。第三者の歴史的プロジェクトは未完成・開発終了でも対象になり得ますが、自作OSの投稿には実際の開発成果が必要です。独立したデスクトップテーマ集も対象になり得ます。\n\n証拠：追跡可能な公開ソースを提示してください。不明な情報は空欄にし、推測で補わないでください。同一・類似名の既存記録も確認してください。\n\n著作権：本アーカイブは非公式・非営利のファン活動です。作者を明記してください。ライセンスまたは明示的な許可がない限り、第三者のファイル、画像、イラスト、ISO、テーマパックをアップロード・再配布しないでください。"
  - type: input
    id: name
    attributes:
      label: "プロジェクト名"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "プロジェクトの分類"
      options:
        - "独自開発のOS"
        - "Linuxディストリビューション"
        - "OSのテーマとカスタマイズ"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "プロジェクトの短い説明"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: "出典または参考資料のURL"
      description: "公開されているHTTPまたはHTTPSのURLを少なくとも1件記入してください。ウェブアーカイブ、リリース記録、当時の文書などを利用できます。"
    validations:
      required: true
  - type: input
    id: aliases
    attributes:
      label: "別名"
  - type: input
    id: developer
    attributes:
      label: "開発者またはチーム"
  - type: input
    id: developmentYear
    attributes:
      label: "開発開始年"
  - type: input
    id: lastUpdated
    attributes:
      label: "確認できる最終更新"
  - type: input
    id: baseSystem
    attributes:
      label: "ベースのOS"
  - type: input
    id: kernel
    attributes:
      label: "カーネル情報"
  - type: input
    id: sourceCodeUrl
    attributes:
      label: "GitHubまたはGitLabリポジトリ"
  - type: input
    id: officialWebsite
    attributes:
      label: "公式サイト"
  - type: textarea
    id: downloadUrl
    attributes:
      label: "ダウンロードリンク"
  - type: textarea
    id: screenshots
    attributes:
      label: "過去のスクリーンショット"
      description: "URLと、作成者または出典、分かる範囲で利用条件を記入してください。"
  - type: textarea
    id: documentation
    attributes:
      label: "ドキュメント"
  - type: input
    id: license
    attributes:
      label: "ライセンス"
  - type: dropdown
    id: developmentStatus
    attributes:
      label: "開発状況"
      options:
        - "開発中"
        - "保守中"
        - "開発終了"
        - "アーカイブ済み"
        - "実験的"
        - "不明"
  - type: textarea
    id: historicalNotes
    attributes:
      label: "その他の歴史資料"
